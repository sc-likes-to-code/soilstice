[project]
name = "soilstice-backend"
version = "0.2.0"
description = "SOILSTICE FastAPI backend: contracts v1.0.0-phase0, data acquisition and processing."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "shapely>=2.0",
  "pyproj>=3.6",
  "numpy>=2.0",
  "rasterio>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls real upstream services over the network (deselected by default; run with -m live)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
